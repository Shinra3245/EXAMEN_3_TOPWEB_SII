<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A local pixel-art login and sign-up page prototype."
    />
    <title>Login | Pixel Gallery</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./script.js" defer></script>
  </head>

  <body>
    <main class="page-shell">
      <div class="login-layout">
        <figure class="artwork">
          <canvas
            class="mosaic-canvas"
            id="mosaic-canvas"
            role="img"
              aria-label="Cielo azul pixelado con nubes claras, casas sobre islas flotantes y cascadas de cuadros azules."
          ></canvas>
        </figure>

        <div class="auth-stage">
          <section class="auth-panel" aria-labelledby="page-title">
            <header class="auth-header">
              <h1 id="page-title">LOGIN</h1>
            </header>

            <div class="mode-switch" role="tablist" aria-label="Account options">
              <button
                class="mode-button is-selected"
                id="login-tab"
                type="button"
                role="tab"
                aria-selected="true"
                aria-controls="auth-form"
              >
                Login
              </button>
              <button
                class="mode-button"
                id="signup-tab"
                type="button"
                role="tab"
                aria-selected="false"
                aria-controls="auth-form"
              >
                Signup
              </button>
            </div>

            <p class="welcome-message" id="welcome-message">
              Welcome back to Pixel Gallery!
              You've been missed!
            </p>

            <form class="auth-form" id="auth-form" aria-labelledby="login-tab">
              <div class="field" id="name-field" hidden>
                <label for="name">Name</label>
                <input
                  id="name"
                  name="name"
                  type="text"
                  autocomplete="name"
                  placeholder="Your name"
                  disabled
                />
              </div>

              <div class="field">
                <label for="email">Email address</label>
                <input
                  id="email"
                  name="email"
                  type="email"
                  autocomplete="email"
                  placeholder="you@example.com"
                  required
                />
              </div>

              <div class="field" id="password-field">
                <label for="password">Password</label>
                <input
                  id="password"
                  name="password"
                  type="password"
                  autocomplete="current-password"
                  placeholder="At least 8 characters"
                  minlength="8"
                  required
                />
              </div>

              <div class="form-links">
                <span id="forgot-copy">Forgot your password?</span>
                <button class="text-button" id="reset-button" type="button">
                  Reset
                </button>
                <button class="text-button" id="back-button" type="button" hidden>
                  Back to login
                </button>
              </div>

              <button class="submit-button" id="submit-button" type="submit" disabled>
                Login
              </button>

              <p class="form-message" id="form-message" role="status" aria-live="polite"></p>
            </form>
          </section>

          <figure class="character-scene">
            <div
              class="character-sprite"
              role="img"
              aria-label="Lince pixelado sentado en una silla y escribiendo en una laptop; mueve las patas y la cola."
            ></div>
          </figure>
        </div>
      </div>
    </main>
  </body>
</html>
